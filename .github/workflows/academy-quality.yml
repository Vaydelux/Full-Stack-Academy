name: Academy Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: academy-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify catalogs and authored samples
        run: npm test
      - name: Validate curriculum package
        run: npm run validate
      - name: Validate publishable MDX metadata and lab fixtures
        run: npm run verify:content
      - name: Test checked-in React lab solution
        run: npm run test:labs
      - name: Production build
        run: npm run build
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/academy-browser" --no-audit --no-fund --save-exact playwright@1.56.1
          "$RUNNER_TEMP/academy-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test the production build in Chromium
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/academy-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          ACADEMY_BROWSER_ROOT="$RUNNER_TEMP/academy-browser" node scripts/browser-smoke.mjs

