name: Academy Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: academy-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify catalogs and authored samples
        run: npm test
      - name: Validate curriculum package
        run: npm run validate
      - name: Validate publishable MDX metadata and lab fixtures
        run: npm run verify:content
      - name: Test checked-in React lab solution
        run: npm run test:labs
      - name: Production build
        run: npm run build
