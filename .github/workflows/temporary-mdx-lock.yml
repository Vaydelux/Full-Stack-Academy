# One-shot feature-branch lockfile regeneration; removed after lock is committed.
name: Temporary MDX Lockfile Generator

on:
  push:
    branches:
      - fix/academy-security-course-alignment-20261118

permissions:
  contents: write

jobs:
  lock:
    if: "!contains(github.event.head_commit.message, '[lock-generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve and lock new MDX toolchain packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock MDX and lab runner dependencies [lock-generated]"
          git push origin HEAD:fix/academy-security-course-alignment-20261118
