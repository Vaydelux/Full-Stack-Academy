name: P4 Prisma security upgrade qualification
on:
  push:
    branches: [publication/p4-runtime-qualification]
permissions:
  contents: read
jobs:
  runtime:
    if: github.repository == 'Vaydelux/Full-Stack-Academy' && github.ref == 'refs/heads/publication/p4-runtime-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Resolve upgraded pinned package graph without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --test scripts/p4-prisma-lock.test.mjs
          out="$RUNNER_TEMP/prisma-upgrade"
          mkdir "$out"
          cp examples/p4-runtime/prisma/package.json "$out/"
          npm install --prefix "$out" --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Verify lock, audit before executing dependencies, and run isolated acceptance
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/qualify-prisma-upgrade.sh
          bash scripts/qualify-prisma-upgrade.sh "$RUNNER_TEMP/prisma-upgrade" 2>&1 | tee "$RUNNER_TEMP/prisma-upgrade.log"
      - name: Retain candidate and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-upgrade-${{ github.sha }}
          path: |
            ${{ runner.temp }}/prisma-upgrade/package.json
            ${{ runner.temp }}/prisma-upgrade/package-lock.json
            ${{ runner.temp }}/prisma-upgrade/receipt.json
            ${{ runner.temp }}/prisma-upgrade.log
          if-no-files-found: warn
          retention-days: 7
