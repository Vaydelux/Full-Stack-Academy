name: P4 Prisma lock candidate

on:
  push:
    branches: [publication/p1-review-handoff]
    paths:
      - '.github/workflows/p4-prisma-lock.yml'
      - 'scripts/p4-prisma-lock*.mjs'
      - 'scripts/verify-p4-prisma-lock.mjs'
      - 'examples/p4-runtime/prisma/package.json'
      - 'examples/p4-runtime/prisma/package-lock.json'

permissions:
  contents: read

jobs:
  lock-candidate:
    if: github.repository == 'Vaydelux/Full-Stack-Academy' && github.ref == 'refs/heads/publication/p1-review-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Test lock validation and generate isolated candidate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --test scripts/p4-prisma-lock.test.mjs
          out="$RUNNER_TEMP/prisma-lock-candidate"
          mkdir "$out"
          cp examples/p4-runtime/prisma/package.json "$out/"
          if [[ -f examples/p4-runtime/prisma/package-lock.json ]]; then
            cp examples/p4-runtime/prisma/package-lock.json "$out/"
          else
            npm install --prefix "$out" --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          fi
          node scripts/verify-p4-prisma-lock.mjs "$out"
          npm ci --prefix "$out" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),p=process.argv[1],r=JSON.parse(fs.readFileSync(p+"/receipt.json"));if(crypto.createHash("sha256").update(fs.readFileSync(p+"/package-lock.json")).digest("hex")!==r.lockSha256)throw Error("Lock changed");fs.writeFileSync(p+"/receipt.json",JSON.stringify({...r,registryInstallVerified:true},null,2)+"\n")' "$out"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain lock candidate and validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: p4-prisma-lock-${{ github.sha }}
          path: |
            ${{ runner.temp }}/prisma-lock-candidate/package.json
            ${{ runner.temp }}/prisma-lock-candidate/package-lock.json
            ${{ runner.temp }}/prisma-lock-candidate/receipt.json
          if-no-files-found: error
          retention-days: 7
