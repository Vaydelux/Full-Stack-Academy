name: P3 isolated PostgreSQL qualification

on:
  push:
    branches: [publication/p1-review-handoff]
    paths:
      - '.github/workflows/p3-postgres-qualification.yml'
      - 'scripts/qualify-p3-*'
      - 'scripts/rehearse-p1-p2-publication.mjs'
      - 'scripts/pg-*'
      - 'drafts/postgresql/**'

permissions:
  contents: read

concurrency:
  group: p3-candidate-${{ github.ref }}
  # Preserve the active evidence run while a newer candidate is queued.
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.repository == 'Vaydelux/Full-Stack-Academy' && github.ref == 'refs/heads/publication/p1-review-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ACADEMY_NATIVE_BROWSER_DRIVER: playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/forms-query-vertical/react-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact candidate and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --version
          python --version
      - name: Configure runner-local paths
        run: |
          printf 'ACADEMY_BROWSER_ROOT=%s/academy-browser\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$ACADEMY_BROWSER_ROOT" --no-audit --no-fund --save-exact playwright@1.56.1
          "$ACADEMY_BROWSER_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          browser=$(node -e 'const {createRequire}=require("node:module");const r=createRequire(process.env.ACADEMY_BROWSER_ROOT+"/package.json");process.stdout.write(r("playwright").chromium.executablePath())')
          test -x "$browser"
          printf 'ACADEMY_CHROME_BIN=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Install exact PostgreSQL 17 client major
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Rehearse through 410 lesson SQL fixture
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/qualify-p3-isolated.sh
          bash scripts/qualify-p3-isolated.sh --rehearse-sql 2>&1 | tee "$RUNNER_TEMP/p3-rehearsal.log"
      - name: Retain automated qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/p3-rehearsal.log
          if-no-files-found: warn
          retention-days: 7

  runtime:
    if: github.repository == 'Vaydelux/Full-Stack-Academy' && github.ref == 'refs/heads/publication/p1-review-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Install exact PostgreSQL 17 client major
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Qualify independent PostgreSQL runtime
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/qualify-p3-isolated.sh
          bash scripts/qualify-p3-isolated.sh 2>&1 | tee "$RUNNER_TEMP/p3-runtime.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p3-runtime.log
            /tmp/academy-f9-review-*/artifacts/*
          if-no-files-found: warn
          retention-days: 7
