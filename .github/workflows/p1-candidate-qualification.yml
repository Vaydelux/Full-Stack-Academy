name: P1 candidate qualification

on:
  push:
    branches: [publication/p1-review-handoff]

permissions:
  contents: read

concurrency:
  group: p1-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1:
    if: github.repository == 'Vaydelux/Full-Stack-Academy' && github.ref == 'refs/heads/publication/p1-review-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ACADEMY_NATIVE_BROWSER_DRIVER: playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/forms-query-vertical/react-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact candidate and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --version
          python --version
      - name: Configure runner-local paths
        run: |
          printf 'ACADEMY_BROWSER_ROOT=%s/academy-browser\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$ACADEMY_BROWSER_ROOT" --no-audit --no-fund --save-exact playwright@1.56.1
          "$ACADEMY_BROWSER_ROOT/node_modules/.bin/playwright" install --with-deps chromium
          browser=$(node -e 'const {createRequire}=require("node:module");const r=createRequire(process.env.ACADEMY_BROWSER_ROOT+"/package.json");process.stdout.write(r("playwright").chromium.executablePath())')
          test -x "$browser"
          printf 'ACADEMY_CHROME_BIN=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Run P1 qualification only
        shell: bash
        run: |
          set -o pipefail
          npm run qualify:academy:local -- --run-p1 2>&1 | tee "$RUNNER_TEMP/p1-qualification.log"
      - name: Rehearse RHF and Query publication in detached disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/academy-review-rhf"
          git worktree add --detach "$review" HEAD
          trap 'git worktree remove --force "$review"' EXIT
          (
            cd "$review"
            npm run promote:forms-query:rhf -- --plan
            npm run promote:forms-query:rhf -- --simulate
            npm run promote:forms-query:query -- --simulate
            npm run promote:forms-query:rhf -- --review
            node -e 'const c=require("./docs/checkpoint.json");if(c.status!=="LOCAL-REVIEW-FIXTURE-DO-NOT-COMMIT"||c.snapshot.publishedLessons!==346)process.exit(1)'
            npm run verify:offline
            node scripts/verify-academy-browser.mjs
            npm run promote:forms-query:query -- --review
            node -e 'const c=require("./docs/checkpoint.json");if(c.status!=="LOCAL-REVIEW-FIXTURE-DO-NOT-COMMIT"||c.snapshot.publishedLessons!==354)process.exit(1)'
            npm run verify:offline
            node scripts/verify-academy-browser.mjs
          ) 2>&1 | tee "$RUNNER_TEMP/p1-review-rehearsal.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain automated qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p1-qualification.log
            ${{ runner.temp }}/p1-review-rehearsal.log
            ${{ runner.temp }}/academy-qualification-*/receipt.json
          if-no-files-found: warn
          retention-days: 7
