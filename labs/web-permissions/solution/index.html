<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permissions and clipboard</title><style>*{box-sizing:border-box}html{font:16px/1.55 system-ui,sans-serif;color:#193249;background:#f2f7fb}body{margin:0}header{background:#e1edf5;padding:1rem max(1rem,calc((100vw - 52rem)/2))}main{max-width:52rem;margin:1.5rem auto;padding:1.5rem;background:#fff;border:1px solid #bed0dc;border-radius:.7rem}h1{line-height:1.2}button,input,select{font:inherit}button{border:0;border-radius:.4rem;padding:.65rem .85rem;margin:.25rem .35rem .25rem 0;color:#fff;background:#174f76;cursor:pointer}input,select{padding:.65rem;margin:.35rem 0;border:1px solid #576e7f;border-radius:.4rem;max-width:100%;width:26rem}label{display:block;font-weight:650;margin-top:1rem}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,iframe:focus-visible{outline:3px solid #c85305;outline-offset:3px}output{display:block;padding:.8rem;margin-top:1rem;min-height:2.5rem;background:#edf4fa;border-radius:.4rem;overflow-wrap:anywhere}code{font-family:ui-monospace,monospace}ul{padding-left:1.4rem}iframe{max-width:100%;width:100%;height:5rem;border:1px solid #789}@media(max-width:520px){main{margin:0;border:0;border-radius:0;padding:1rem}}</style></head><body><header><p>Web APIs & Security — offline practice</p></header><main><h1>Permissions and clipboard</h1><p>Self-contained synthetic exercise. No accounts, remote requests or private data.</p><label for="sample">Safe sample</label><input id="sample" readonly value="npm run verify:content"><button type="button" id="copy">Copy safe sample</button><output id="status" role="status">Nothing copied yet.</output><script>const sample='npm run verify:content';const field=document.querySelector('#sample');field.value=sample;const status=document.querySelector('#status');document.querySelector('#copy').addEventListener('click',async()=>{if(!navigator.clipboard?.writeText){status.textContent='Select the sample and copy manually.';return;}try{await navigator.clipboard.writeText(sample);status.textContent='Copied the sample text.';}catch{status.textContent='Clipboard unavailable. Select the sample and copy manually.';}});</script></main></body></html>
