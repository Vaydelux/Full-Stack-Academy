<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Starter: Security of innerHTML</title>
<style>*{box-sizing:border-box}html{font:16px/1.5 system-ui,sans-serif;color:#17344a;background:#edf4f8}body{margin:0}header{padding:1rem;background:#d8eaf4}main{max-width:52rem;margin:1rem auto;padding:1rem}section{background:white;border:1px solid #a9c9d9;border-radius:.6rem;padding:1rem}button,input{font:inherit}button{padding:.45rem .8rem;margin:.3rem}button:focus-visible,input:focus-visible,[role=tab]:focus-visible{outline:3px solid #b84f05;outline-offset:3px}output{display:block;padding:.75rem;margin-top:.5rem}p{overflow-wrap:anywhere}</style></head><body>
<header>Browser Interaction · offline educational exercise</header><main><h1>Security of innerHTML</h1><p>A preview inserts user text into innerHTML and unexpectedly creates clickable elements and script-capable markup.</p><section id="demo"><label for="text">Preview text</label><input id="text" value="&lt;strong&gt;hello&lt;/strong&gt;"><button type="button" id="preview">Preview as text</button><output id="status" role="status">Nothing previewed.</output></section><p>All behavior is local; no API credentials, analytics or uploaded data.</p></main>
<script>document.querySelector('#preview').addEventListener('click',()=>{document.querySelector('#status').innerHTML=document.querySelector('#text').value;});</script></body></html>
