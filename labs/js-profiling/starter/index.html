<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Starter: Browser performance profiling</title>
<style>*{box-sizing:border-box}html{font:16px/1.5 system-ui,sans-serif;color:#17344a;background:#edf4f8}body{margin:0}header{padding:1rem;background:#d8eaf4}main{max-width:52rem;margin:1rem auto;padding:1rem}section{background:white;border:1px solid #a9c9d9;border-radius:.6rem;padding:1rem}button,input{font:inherit}button{padding:.45rem .8rem;margin:.3rem}button:focus-visible,input:focus-visible,[role=tab]:focus-visible{outline:3px solid #b84f05;outline-offset:3px}output{display:block;padding:.75rem;margin-top:.5rem}p{overflow-wrap:anywhere}</style></head><body>
<header>Browser Interaction · offline educational exercise</header><main><h1>Browser performance profiling</h1><p>A UI claims every operation is fast without measuring work or identifying the action being timed.</p><section id="demo"><button id="measure" type="button">Measure local calculation</button><output id="status" role="status">No measurement recorded.</output></section><p>All behavior is local; no API credentials, analytics or uploaded data.</p></main>
<script>document.querySelector('#measure').addEventListener('click',()=>document.querySelector('#status').textContent='Always 0 ms, perfectly fast.');</script></body></html>
