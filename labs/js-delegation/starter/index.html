<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Starter: Event delegation</title>
<style>*{box-sizing:border-box}html{font:16px/1.5 system-ui,sans-serif;color:#17344a;background:#edf4f8}body{margin:0}header{padding:1rem;background:#d8eaf4}main{max-width:52rem;margin:1rem auto;padding:1rem}section{background:white;border:1px solid #a9c9d9;border-radius:.6rem;padding:1rem}button,input{font:inherit}button{padding:.45rem .8rem;margin:.3rem}button:focus-visible,input:focus-visible,[role=tab]:focus-visible{outline:3px solid #b84f05;outline-offset:3px}output{display:block;padding:.75rem;margin-top:.5rem}p{overflow-wrap:anywhere}</style></head><body>
<header>Browser Interaction · offline educational exercise</header><main><h1>Event delegation</h1><p>Newly added list items do not respond to click because listeners were attached only to existing children.</p><section id="demo"><ul id="items"><li><button type="button" data-name="A">Select A</button></li></ul><button type="button" id="append">Add B</button><output id="status" role="status">Choose an item.</output></section><p>All behavior is local; no API credentials, analytics or uploaded data.</p></main>
<script>document.querySelectorAll('#items button').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#status').textContent=b.dataset.name;}));document.querySelector('#append').addEventListener('click',()=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.dataset.name='B';b.textContent='Select B';li.append(b);document.querySelector('#items').append(li);});</script></body></html>
