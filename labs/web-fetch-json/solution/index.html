<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch API and JSON</title><style>*{box-sizing:border-box}html{font:16px/1.55 system-ui,sans-serif;color:#193249;background:#f2f7fb}body{margin:0}header{background:#e1edf5;padding:1rem max(1rem,calc((100vw - 52rem)/2))}main{max-width:52rem;margin:1.5rem auto;padding:1.5rem;background:#fff;border:1px solid #bed0dc;border-radius:.7rem}h1{line-height:1.2}button,input,select{font:inherit}button{border:0;border-radius:.4rem;padding:.65rem .85rem;margin:.25rem .35rem .25rem 0;color:#fff;background:#174f76;cursor:pointer}input,select{padding:.65rem;margin:.35rem 0;border:1px solid #576e7f;border-radius:.4rem;max-width:100%;width:26rem}label{display:block;font-weight:650;margin-top:1rem}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,iframe:focus-visible{outline:3px solid #c85305;outline-offset:3px}output{display:block;padding:.8rem;margin-top:1rem;min-height:2.5rem;background:#edf4fa;border-radius:.4rem;overflow-wrap:anywhere}code{font-family:ui-monospace,monospace}ul{padding-left:1.4rem}iframe{max-width:100%;width:100%;height:5rem;border:1px solid #789}@media(max-width:520px){main{margin:0;border:0;border-radius:0;padding:1rem}}</style></head><body><header><p>Web APIs & Security — offline practice</p></header><main><h1>Fetch API and JSON</h1><p>Self-contained synthetic exercise. No accounts, remote requests or private data.</p><button type="button" id="load">Load sample JSON</button><button type="button" id="http">Simulate HTTP 503</button><button type="button" id="network">Simulate network failure</button><button type="button" id="malformed">Simulate malformed JSON</button><button type="button" id="cancel">Cancel request</button><output id="status" role="status">Ready; no real requests are sent.</output><script>const status=document.querySelector('#status');let controller;async function readDemo(mode,signal){await new Promise((resolve,reject)=>{const timeout=setTimeout(resolve,100);signal.addEventListener('abort',()=>{clearTimeout(timeout);reject(new DOMException('Request cancelled','AbortError'));},{once:true});});if(mode==='network')throw new TypeError('Simulated transport failure');if(mode==='http-error')return new Response('{"message":"Unavailable"}',{status:503});if(mode==='malformed')return new Response('{not json',{status:200});return new Response(JSON.stringify({items:['DOM','Fetch']}),{status:200,headers:{'Content-Type':'application/json'}});}async function run(mode){controller?.abort();const current=new AbortController();controller=current;status.textContent='Loading simulated response...';try{const response=await readDemo(mode,current.signal);if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();status.textContent=data.items.length+' sample items loaded locally. No network request.';}catch(error){if(error.name==='AbortError')status.textContent='Request cancelled.';else if(error instanceof SyntaxError)status.textContent='JSON parsing failed.';else status.textContent='Request failed: '+error.message;}}document.querySelector('#load').addEventListener('click',()=>run('ok'));document.querySelector('#http').addEventListener('click',()=>run('http-error'));document.querySelector('#network').addEventListener('click',()=>run('network'));document.querySelector('#malformed').addEventListener('click',()=>run('malformed'));document.querySelector('#cancel').addEventListener('click',()=>controller?.abort());</script></main></body></html>
