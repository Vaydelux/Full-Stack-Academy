<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WCAG principles and practical checks</title><style>
*{box-sizing:border-box}html{font-family:system-ui,sans-serif;color:#183249;background:#f3f8fb}
body{margin:0;line-height:1.6}
header,footer{padding:1rem max(1rem,calc((100vw - 64rem)/2));background:#e2f0f5}
nav{padding:.75rem max(1rem,calc((100vw - 64rem)/2));display:flex;gap:1rem;flex-wrap:wrap}
main{max-width:52rem;margin:1.25rem auto;padding:clamp(1rem,4vw,2rem);background:white;border:1px solid #bbd1dd;border-radius:.65rem}
a{color:#005778;text-underline-offset:.2em}button,input,textarea,select{font:inherit}button{cursor:pointer;padding:.6rem .9rem;background:#125a79;color:white;border:0;border-radius:.4rem;margin:.3rem}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #d76300;outline-offset:4px}
label{display:block;margin:.7rem 0 .3rem;font-weight:650}input:not([type=checkbox]):not([type=radio]),textarea{width:100%;padding:.6rem;border:1px solid #6b7f8d;border-radius:.3rem}
fieldset{padding:1rem;margin:1rem 0;border:1px solid #8aa5b5}fieldset label{font-weight:400}
.skip{position:absolute;left:.75rem;top:.5rem;padding:.75rem;background:white;transform:translateY(-220%);z-index:3}.skip:focus{transform:translateY(0)}
.output{min-height:1.5rem;margin:.75rem 0;font-weight:600}dialog{max-width:min(95vw,32rem);border:1px solid #8299a6;border-radius:.65rem;padding:1.3rem}dialog::backdrop{background:#172e4388}
ul,ol{padding-left:1.5rem}img{max-width:100%;height:auto}
@media(max-width:480px){main{margin:.6rem 0;border-radius:0}}
</style></head>
<body>
<a class="skip" href="#main-content">Skip to main content</a>
<main id="main-content" tabindex="-1">
<h1>WCAG POUR preliminary review</h1>
<p>This is a learning checklist, not a WCAG conformance certificate.</p>
<fieldset><legend>Preliminary page review</legend>
<label><input type="checkbox" name="pour" value="perceivable"> Perceivable: text alternatives</label>
<label><input type="checkbox" name="pour" value="operable"> Operable: keyboard actions</label>
<label><input type="checkbox" name="pour" value="understandable"> Understandable: field instructions</label>
<label><input type="checkbox" name="pour" value="robust"> Robust: native semantics</label>
</fieldset>
<button type="button" id="summarize">Summarize observations</button>
<p id="result" role="status" aria-live="polite">No observations summarized.</p>
<p>Review the <a href="https://www.w3.org/TR/WCAG22/" target="_blank" rel="noopener noreferrer">WCAG 2.2 Recommendation (opens in a new tab)</a> for specific success criteria.</p>
</main>
<script>
document.querySelector('#summarize').addEventListener('click',()=>{
 const chosen=document.querySelectorAll('input[name="pour"]:checked').length;
 const total=document.querySelectorAll('input[name="pour"]').length;
 document.querySelector('#result').textContent=chosen+' of '+total+' preliminary observations marked. Not a conformance audit.';
});
</script>
</body>
</html>
