</style></head><body><header>CSS Fundamentals · offline lesson 02.01.07</header><main><h1>Pseudo classes and states</h1><p>A button looks interactive on hover but has no keyboard focus indicator.</p><section class="card"><h2>Register for class</h2><button type="button" class="action" id="action">Select lesson</button><button type="button" disabled>Unavailable lesson</button><output id="status" role="status">Press Tab to focus the action.</output></section><p>Practice is local only; no credentials, external API or submission.</p></main><script>document.querySelector('#action').addEventListener('click',()=>document.querySelector('#status').textContent='Lesson selected locally.');</script></body></html>
