<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Hunt inaccessible form</title><style>
*{box-sizing:border-box}html{font-family:system-ui,sans-serif;color:#19334a;background:#f5f9fc}
body{margin:0;padding:1rem}main{width:min(100%,48rem);margin:2rem auto;background:#fff;padding:clamp(1rem,4vw,2rem);border:1px solid #c4d5df;border-radius:.8rem}
label{display:block;font-weight:650;margin:.8rem 0 .25rem}input,select,textarea,button{font:inherit}
input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{width:100%;max-width:100%;padding:.65rem;border:1px solid #6f8292;border-radius:.3rem}
button{padding:.65rem 1rem;margin:.75rem .5rem .25rem 0;background:#125a79;color:#fff;border:0;border-radius:.4rem;cursor:pointer}
a{color:#075679}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #e67b18;outline-offset:3px}
fieldset{margin:1rem 0;border:1px solid #9cafbb;border-radius:.4rem;padding:1rem}
fieldset label{font-weight:400;display:block}fieldset input{margin-inline-end:.35rem}.hint{font-size:.9rem;color:#354e60;margin:.2rem 0 .7rem}
output,.status{display:block;margin:.75rem 0;font-weight:650;white-space:pre-wrap}.error,[role=alert]{color:#9f2525}
dialog{max-width:min(95vw,30rem);border:1px solid #6f8292;border-radius:.75rem;padding:1.5rem}
dialog::backdrop{background:#17364b9e}[popover]{max-width:min(85vw,25rem);padding:1rem;border:1px solid #6f8292;border-radius:.5rem}
@media(max-width:480px){main{margin:.5rem auto}}
</style></head>
<body><main><h1>Workshop contact preview</h1>
<p>This exercise does not transmit or save information. Use synthetic values.</p>
<form id="contact-form">
<label for="contact-name">Display name</label><input id="contact-name" name="displayName" autocomplete="nickname" required>
<label for="contact-email">Contact email</label><input id="contact-email" name="email" type="email" autocomplete="email" required>
<fieldset><legend>Contact preference</legend>
<label><input type="radio" name="preference" value="email" required> Email</label>
<label><input type="radio" name="preference" value="none"> No follow-up</label>
</fieldset>
<label for="message">Workshop question</label><p id="message-hint" class="hint">At least 10 characters. No real messages are sent.</p>
<textarea id="message" name="message" rows="5" required minlength="10" aria-describedby="message-hint"></textarea>
<button type="submit">Preview form</button>
<p id="error-summary" role="alert"></p>
<p id="success-status" role="status" aria-live="polite"></p>
</form></main><script>
const form=document.querySelector('#contact-form');
const error=document.querySelector('#error-summary');
const status=document.querySelector('#success-status');
form.addEventListener('invalid',event=>{
  error.textContent='Check the highlighted field: '+(event.target.labels?.[0]?.textContent||'Required information');
  status.textContent='';
},true);
form.addEventListener('input',()=>{
  if(error.textContent)error.textContent='';
});
form.addEventListener('submit',event=>{
  event.preventDefault();
  error.textContent='';
  status.textContent='Local form preview complete. Nothing sent or saved.';
});
</script></body>
</html>
