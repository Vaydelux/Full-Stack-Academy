<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solution: URL state and History API</title>
<style>*{box-sizing:border-box}html{font:16px/1.5 system-ui,sans-serif;color:#17344a;background:#edf4f8}body{margin:0}header{padding:1rem;background:#d8eaf4}main{max-width:52rem;margin:1rem auto;padding:1rem}section{background:white;border:1px solid #a9c9d9;border-radius:.6rem;padding:1rem}button,input{font:inherit}button{padding:.45rem .8rem;margin:.3rem}button:focus-visible,input:focus-visible,[role=tab]:focus-visible{outline:3px solid #b84f05;outline-offset:3px}output{display:block;padding:.75rem;margin-top:.5rem}p{overflow-wrap:anywhere}</style></head><body>
<header>Browser Interaction · offline educational exercise</header><main><h1>URL state and History API</h1><p>A filter selection changes the UI but is lost on refresh because it is not represented in the URL.</p><section id="demo"><label for="filter">Lesson filter</label><input id="filter" value="CSS & Web"><button id="apply" type="button">Apply filter</button><output id="status" role="status">No filter applied.</output></section><p>All behavior is local; no API credentials, analytics or uploaded data.</p></main>
<script>const output=document.querySelector('#status');const apply=()=>{const value=document.querySelector('#filter').value.trim();history.replaceState(null,'','#filter='+encodeURIComponent(value));output.textContent='Filter: '+value;};document.querySelector('#apply').addEventListener('click',apply);window.addEventListener('hashchange',()=>{const raw=location.hash.slice('#filter='.length);output.textContent='Filter: '+decodeURIComponent(raw);});</script></body></html>
