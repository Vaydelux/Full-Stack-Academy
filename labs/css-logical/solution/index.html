<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solution: Logical properties</title><style>
* { box-sizing: border-box; } html { font: 16px/1.6 system-ui, sans-serif; color: #17364b; background: #f0f6f9; } body { margin: 0; } header { padding: 1rem; background: #dbeaf2; } main { max-inline-size: 56rem; margin: 1rem auto; padding: 1rem; } .card { margin-block: 1rem; background: white; border: 1px solid #acc4d1; border-radius: .75rem; padding: 1rem; } button { font: inherit; padding: .65rem 1rem; border-radius: .5rem; border: 1px solid #56829a; cursor: pointer; } output { display:block; margin-block:1rem; overflow-wrap:anywhere; } h1, h2 { line-height: 1.25; }

</style></head><body><header>CSS Fundamentals · offline lesson 02.01.06</header><main><h1>Logical properties</h1><p>A card with left padding and a left border looks wrong when displayed right-to-left.</p><section class="card" id="card" dir="rtl"><h2>بطاقة الدورة</h2><p>RTL workshop card</p></section><button type="button" id="toggle">Toggle writing direction</button><output id="status" role="status">Direction: rtl</output><p>Practice is local only; no credentials, external API or submission.</p></main><script>document.querySelector('#toggle').addEventListener('click',()=>{const card=document.querySelector('#card');card.dir=card.dir==='rtl'?'ltr':'rtl';document.querySelector('#status').textContent='Direction: '+card.dir;});</script></body></html>
