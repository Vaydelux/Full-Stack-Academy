<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labels controls and fieldsets</title>
<style>
*{box-sizing:border-box}html{font-family:system-ui,sans-serif;color:#19334a;background:#f5f9fc}
body{margin:0;padding:1rem}main{width:min(100%,44rem);margin:2rem auto;background:#fff;padding:clamp(1rem,4vw,2rem);border:1px solid #c4d5df;border-radius:.8rem}
label{display:block;font-weight:650;margin:.8rem 0 .25rem}input,select,textarea,button{font:inherit}
input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{width:100%;max-width:100%;padding:.65rem;border:1px solid #6f8292;border-radius:.3rem}
button{padding:.65rem 1rem;margin:.75rem .5rem .25rem 0;background:#125a79;color:#fff;border:0;border-radius:.4rem;cursor:pointer}
a{color:#075679}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #e67b18;outline-offset:3px}
fieldset{margin:1rem 0;border:1px solid #9cafbb;border-radius:.4rem;padding:1rem}
fieldset label{font-weight:400}fieldset input{margin-inline-end:.35rem}.hint{font-size:.9rem;color:#354e60;margin:.2rem 0 .7rem}
output,.status{display:block;margin:.75rem 0;font-weight:650;white-space:pre-wrap}.error{color:#9f2525}
@media(max-width:480px){main{margin:.5rem auto}}
</style>
</head>
<body>
<main>
<h1>Register your workshop interest</h1>
<p>All information is synthetic; this lesson does not send data anywhere.</p>
<form id="interest">
<label for="full-name">Full name</label>
<input id="full-name" name="fullName" autocomplete="name" required>
<label for="contact-email">Contact email</label>
<p id="email-hint" class="hint">Use an address you can access.</p>
<input id="contact-email" name="email" type="email" aria-describedby="email-hint" required>
<fieldset><legend>Preferred session</legend>
<label><input type="radio" name="session" value="morning" required> Morning</label>
<label><input type="radio" name="session" value="afternoon"> Afternoon</label>
</fieldset>
<button type="submit">Preview fields</button>
<output id="preview" for="full-name contact-email">Nothing submitted.</output>
</form>
</main>
<script>
document.querySelector('#interest').addEventListener('submit',event=>{
  event.preventDefault();
  const values=new FormData(event.currentTarget);
  document.querySelector('#preview').textContent='Ready to preview: '+String(values.get('fullName')||'')+' / '+String(values.get('session')||'');
});
</script>
</body>
</html>
